# Builds the Valley Life game (valley_life.py) into a Windows .exe.
# Every push to main also publishes it as the "latest" GitHub Release, so anyone can download it:
#   https://github.com/davidvstuhl-prog/Valley-Life/releases/latest
name: Build Valley Life .exe

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # lets the build update the "latest" release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pygame and PyInstaller
        run: pip install pygame pyinstaller
      - name: Build ValleyLife.exe
        run: pyinstaller --onefile --windowed --name ValleyLife valley_life.py
      - name: Smoke-test the game code
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -c "import valley_life as v; g = v.Game(); g.start(); g.update(0.1); g.draw(); print('ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: ValleyLife-Windows
          path: |
            dist/ValleyLife.exe
            README.md
      - name: Move the "latest" tag to this build
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git tag -f latest
          git push -f origin refs/tags/latest
      - name: Publish ValleyLife.exe as the latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Valley Life for Windows (latest)
          body: |
            Download **ValleyLife.exe** below and double-click it. No install needed.
            If Windows says "Windows protected your PC", click **More info**, then **Run anyway**.
            Prefer the browser? Play at https://davidvstuhl-prog.github.io/Valley-Life/
          files: dist/ValleyLife.exe
          make_latest: true
